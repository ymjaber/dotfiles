background {
    monitor =
    # PASS 1 blurs a live screenshot. theming.md's `wallpaper` renders a pre-blurred
    # ~/.cache/lockwall.png and switches this to that path with blur_passes = 0, which is far
    # cheaper at lock time. Pointing there before the file exists gives a black lock screen.
    path = screenshot
    blur_passes = 2
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
    }
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    dots_center = true
    fade_on_empty = false
    placeholder_text = <i>password or finger</i>
    fail_text = $PAMFAIL$FPRINTFAIL
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}
