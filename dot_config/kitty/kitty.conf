font_family      JetBrainsMono Nerd Font
font_size        11.0

# remote control via the unix socket only, never the tty (theme engine reloads live kitty)
allow_remote_control socket-only
listen_on        unix:@kitty

# theme engine rewrites theme.conf; touched empty until theming lands
include          theme.conf

# prompt jumps + new windows/tabs inherit cwd
shell_integration enabled
scrollback_lines 20000
enable_audio_bell no

# keyboard-first: no exit dialogs
confirm_os_window_close 0

map kitty_mod+enter new_window_with_cwd
map kitty_mod+t     new_tab_with_cwd
map kitty_mod+n     new_os_window_with_cwd

# ctrl+shift+g: copy last command's output to the clipboard
map kitty_mod+g     launch --stdin-source=@last_cmd_output --type=background sh -c 'wl-copy'

# browse scrollback in nvim instead of less (kitty's own documented line)
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

# hints kitten, copy-to-clipboard variants; the insert variants ctrl+shift+p>f/l/w are kitty defaults
map kitty_mod+p>c kitten hints --type path --program @
map kitty_mod+p>u kitten hints --type url --program @
map kitty_mod+p>m kitten hints --type path --multiple --program -

# ms the cursor must rest before the trail animates (0 = off)
cursor_trail 3

window_padding_width 4
