[mgr]
ratio = [1, 3, 4]            # parent / current / preview widths
sort_by = "natural"
sort_dir_first = true
show_hidden = false
linemode = "size"
[preview]
max_width = 1000             # kitty graphics previews work natively
max_height = 1000
[opener]
edit = [{ run = 'nvim "$@"', block = true }]
open = [{ run = 'xdg-open "$@"', desc = "open", orphan = true }]
[open]
prepend_rules = [{ mime = "text/*", use = "edit" }]

# git-status column; two entries: files, then directories
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
