[[mgr.prepend_keymap]]
on = ["<C-n>"]               # drag selected files into a GUI app (local)
run = 'shell -- ripdrag -a -x "$@" &'
desc = "drag-out to GUI (ripdrag)"

[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the directory, or open the file"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin jump-to-char"
desc = "Jump to char"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "u"
run  = "plugin restore"
desc = "Restore last deleted files"

[[mgr.prepend_keymap]]
on   = "U"
run  = "plugin restore -- --interactive"
desc = "Restore deleted files (interactive)"
