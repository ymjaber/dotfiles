auto_sync = false            # local-first; sync decision reopens with the servers use case
search_mode = "daemon-fuzzy" # uses the daemon's in-memory index
filter_mode = "global"
workspaces = true            # inside a git repo, filter to that repo
enter_accept = false         # first enter edits, second runs
keymap_mode = "vim-insert"
style = "compact"
inline_height = 30
show_preview = true
secrets_filter = true
store_failed = true

[daemon]
enabled = true
autostart = true             # arch ships no systemd units for atuin
sync_frequency = 300         # seconds here; the top-level one is a "10m" string
